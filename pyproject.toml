[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viscomm"
version = "0.3.0"
description = "A small, opinionated Python charting library with accessible, validated defaults"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/viscomm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
