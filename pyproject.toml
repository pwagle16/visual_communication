[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple_eda"
version = "0.6.0"
description = "The simplest possible exploratory-data-analysis helpers for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "pwagle16" }]
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/simple_eda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
